<section class="mt-5 overflow-hidden rounded-xl border border-slate-700/80 bg-slate-800/70 p-4">
  <h3 class="mb-4 text-lg font-bold text-white">Internal Force Diagrams</h3>
  <svg
    viewBox="0 0 1000 400"
    class="block w-full overflow-visible"
    role="img"
    aria-label="Axial force, shear force, and bending moment diagrams"
  >
    @for (forceDiagram of internalForceDiagrams; track forceDiagram.force) {
      <g>
        <text x="12" [attr.y]="forceDiagram.top + 42" fill="#cbd5e1" font-size="13">
          {{ forceDiagram.label }}
        </text>
        <line
          [attr.x1]="diagram.left"
          [attr.x2]="diagram.left + diagram.width"
          [attr.y1]="forceDiagram.top + 38"
          [attr.y2]="forceDiagram.top + 38"
          stroke="#64748b"
        />

        <!-- Vertical (force magnitude) axis -->
        <g stroke="#94a3b8" stroke-width="1.5">
          <line
            [attr.x1]="diagram.left"
            [attr.x2]="diagram.left"
            [attr.y1]="forceDiagram.top"
            [attr.y2]="forceDiagram.top + 78"
          />
          @for (offset of verticalAxisTickOffsets; track offset) {
            <line
              [attr.x1]="diagram.left - 4"
              [attr.x2]="diagram.left + 4"
              [attr.y1]="forceDiagram.top + offset"
              [attr.y2]="forceDiagram.top + offset"
            />
          }
        </g>

        <!-- Vertical axis value labels -->
        <text
          [attr.x]="diagram.left - 8"
          [attr.y]="forceDiagram.top + 4"
          text-anchor="end"
          fill="#94a3b8"
          font-size="11"
        >
          {{ formatAxisValue(forceMaximum(forceDiagram.force)) }}
        </text>
        <text
          [attr.x]="diagram.left - 8"
          [attr.y]="forceDiagram.top + 42"
          text-anchor="end"
          fill="#94a3b8"
          font-size="11"
        >
          0
        </text>
        <text
          [attr.x]="diagram.left - 8"
          [attr.y]="forceDiagram.top + 80"
          text-anchor="end"
          fill="#94a3b8"
          font-size="11"
        >
          {{ formatAxisValue(-forceMaximum(forceDiagram.force)) }}
        </text>
        <path
          [attr.d]="internalForcePath(forceDiagram.force, forceDiagram.top)"
          fill="none"
          [attr.stroke]="forceDiagram.color"
          stroke-width="3"
        />
        @for (point of convertedResult?.points; track point.location) {
          <circle
            [attr.cx]="beamX(point.location, convertedResult?.beam?.length)"
            [attr.cy]="
              internalForceY(
                point.internalForces[forceDiagram.force],
                forceDiagram.force,
                forceDiagram.top
              )
            "
            r="2.5"
            fill="#f8fafc"
            stroke="rgba(148, 163, 184, 0.8)"
            stroke-width="1.5"
            class="cursor-help"
            (mouseenter)="
              showTooltip($event, forceDiagram.label, [
                {
                  label: 'Position',
                  value: formatValue(point.location) + ' ' + (convertedResult?.units?.length ?? ''),
                },
                {
                  label: 'Value',
                  value:
                    formatValue(point.internalForces[forceDiagram.force]) +
                    ' ' +
                    (forceDiagram.force === 'moment'
                      ? convertedResult?.units?.moment
                      : convertedResult?.units?.force),
                },
              ])
            "
            (mousemove)="moveTooltip($event)"
            (mouseleave)="hideTooltip()"
          ></circle>
        }
      </g>
    }

    <!-- Shared horizontal (beam position) axis -->
    <g stroke="#94a3b8" stroke-width="1.5">
      <line
        [attr.x1]="diagram.left - 6"
        [attr.x2]="diagram.left + diagram.width + 10"
        [attr.y1]="horizontalAxisY"
        [attr.y2]="horizontalAxisY"
      />
      @for (tick of horizontalAxisTicks; track tick.x) {
        <line
          [attr.x1]="tick.x"
          [attr.x2]="tick.x"
          [attr.y1]="horizontalAxisY - 4"
          [attr.y2]="horizontalAxisY + 4"
        />
      }
    </g>
    @for (tick of horizontalAxisTicks; track tick.x) {
      <text
        [attr.x]="tick.x"
        [attr.y]="horizontalAxisY + 18"
        text-anchor="middle"
        fill="#94a3b8"
        font-size="11"
      >
        {{ tick.label }}
      </text>
    }
  </svg>

  <h3 class="mb-4 mt-6 text-lg font-bold text-white">Displacements</h3>
  <svg
    viewBox="0 0 1000 160"
    class="block w-full overflow-visible"
    role="img"
    aria-label="Axial, vertical, and rotational displacement diagrams"
  >
    <line
      [attr.x1]="diagram.left"
      [attr.x2]="diagram.left + diagram.width"
      y1="58"
      y2="58"
      stroke="#e2e8f0"
      stroke-width="1"
    />
    @for (support of calculatedModel?.supports; track support; let index = $index) {
      <g
        [attr.transform]="'translate(' + beamX(support.location, calculatedModel.length) + ', 58)'"
        class="cursor-help"
        (mouseenter)="
          showTooltip($event, 'Support ' + (index + 1), [
            {
              label: 'Position',
              value: formatValue(support.location) + ' ' + (convertedResult?.units?.length ?? ''),
            },
          ])
        "
        (mousemove)="moveTooltip($event)"
        (mouseleave)="hideTooltip()"
      >
        @switch (supportType(support)) {
          @case ('fixed') {
            <path d="M 0 -20 0 20" stroke="#cbd5e1" stroke-width="3" />
            <g stroke="#cbd5e1" stroke-width="1.5">
              <line x1="0" y1="-20" x2="-10" y2="-14" />
              <line x1="0" y1="-10" x2="-10" y2="-4" />
              <line x1="0" y1="0" x2="-10" y2="6" />
              <line x1="0" y1="10" x2="-10" y2="16" />
              <line x1="0" y1="20" x2="-10" y2="26" />
            </g>
          }
          @case ('pinned') {
            <path d="M 0 0 L -12 18 L 12 18 Z" fill="#38bdf8" stroke="#e0f2fe" />
            <line x1="-17" y1="18" x2="17" y2="18" stroke="#cbd5e1" stroke-width="2" />
          }
          @case ('roller') {
            <path d="M 0 0 L -12 16 L 12 16 Z" fill="#38bdf8" stroke="#e0f2fe" />
            <circle cx="-7" cy="22" r="2.5" fill="#e0f2fe" />
            <circle cx="0" cy="22" r="2.5" fill="#e0f2fe" />
            <circle cx="7" cy="22" r="2.5" fill="#e0f2fe" />
            <line x1="-17" y1="27" x2="17" y2="27" stroke="#cbd5e1" stroke-width="2" />
          }
          @default {
            <circle cx="0" cy="0" r="6" fill="#a855f7" stroke="#f3e8ff" />
          }
        }
      </g>
    }
    @for (point of convertedResult?.points; track point.location; let index = $index) {
      <circle
        [attr.cx]="beamX(point.location, convertedResult?.beam?.length)"
        cy="58"
        r="3.5"
        fill="#f8fafc"
        stroke="#38bdf8"
        stroke-width="1.5"
        class="cursor-help"
        (mouseenter)="
          showTooltip($event, 'Displacements', [
            {
              label: 'Position',
              value: formatValue(point.location) + ' ' + (convertedResult?.units?.length ?? ''),
            },
            {
              label: 'Axial',
              value:
                convertedResult?.displacements?.[index]?.axial ??
                0 + ' ' + (convertedResult?.units?.length ?? ''),
            },
            {
              label: 'Vertical',
              value:
                convertedResult?.displacements?.[index]?.vertical ??
                0 + ' ' + (convertedResult?.units?.length ?? ''),
            },
            {
              label: 'Rotational',
              value: convertedResult?.displacements?.[index]?.rotational ?? 0 + ' rad',
            },
          ])
        "
        (mousemove)="moveTooltip($event)"
        (mouseleave)="hideTooltip()"
      ></circle>
    }
    @for (tick of horizontalAxisTicks; track tick.x) {
      <text [attr.x]="tick.x" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">
        {{ tick.label }}
      </text>
    }
  </svg>

  @if (tooltip) {
    <div
      class="pointer-events-none fixed z-20 min-w-47.5 max-w-[min(300px,calc(100vw-28px))] rounded-md border border-sky-400/55 bg-slate-950/98 p-3 text-slate-200 shadow-[0_12px_28px_rgb(2_6_23/0.45)]"
      role="tooltip"
      [style.left.px]="tooltip.x"
      [style.top.px]="tooltip.y"
    >
      <strong class="mb-2 block text-[0.8rem] tracking-normal text-sky-300">
        {{ tooltip.title }}
      </strong>
      <dl
        class="m-0 grid grid-cols-[max-content_minmax(0,1fr)] gap-x-3.5 gap-y-1.25 text-xs leading-[1.35]"
      >
        @for (detail of tooltip.details; track detail.label) {
          <dt class="text-slate-400">{{ detail.label }}</dt>
          <dd class="m-0 overflow-wrap-anywhere text-right text-slate-50">
            {{ detail.value }}
          </dd>
        }
      </dl>
    </div>
  }
</section>
