<aside
  class="sticky top-0 flex h-screen w-64 shrink-0 flex-col border-r border-slate-700/80 bg-slate-900 px-4 py-5 text-slate-200 shadow-lg"
  aria-label="Sidebar navigation"
>
  <div class="mb-8 flex items-center gap-3 border-b border-slate-700/60 pb-4">
    <div
      class="flex h-10 w-10 items-center justify-center rounded-xl bg-linear-to-br from-blue-400 to-blue-600 font-bold text-white shadow-lg shadow-blue-500/30"
    >
      S
    </div>
    <div class="flex flex-col">
      <span class="text-base font-bold tracking-wide text-white">StrEng</span>
      <span class="text-xs text-slate-400">Workspace</span>
    </div>
  </div>

  <nav class="flex flex-1 flex-col gap-2" aria-label="Main navigation">
    @for (item of navItems; track item.label) {
      <a
        href="{{ item.href }}"
        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold transition duration-200"
        [class.bg-blue-500/15]="item.active"
        [class.text-blue-100]="item.active"
        [class.text-slate-300]="!item.active"
        [class.hover:bg-slate-800]="!item.active"
        [class.shadow-inner]="item.active"
        [attr.aria-current]="item.active ? 'page' : null"
      >
        <span class="flex w-5 justify-center text-base" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <button
    type="button"
    class="mb-3 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-500 px-3 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-400 cursor-pointer"
    aria-label="Create new project"
    (click)="goToProjects()"
  >
    <span class="text-base" aria-hidden="true">＋</span>
    <span>New Project</span>
  </button>

  <button
    type="button"
    class="mt-auto flex items-center justify-between rounded-xl border border-slate-700 bg-slate-800/80 px-3 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-700 cursor-pointer"
    (click)="toggleTheme()"
    aria-label="Toggle theme"
  >
    <span>{{ isDarkTheme ? 'Light mode' : 'Dark mode' }}</span>
    <span class="text-base" aria-hidden="true">{{ isDarkTheme ? '☀️' : '🌙' }}</span>
  </button>
</aside>
